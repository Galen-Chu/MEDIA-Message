name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 單元測試(純邏輯模組)
      - run: npm test
      # 建置(M0 骨架無任何 secret 依賴,任何環境皆可建置)
      - run: npm run build
      # E2E smoke 跑在 preview server
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

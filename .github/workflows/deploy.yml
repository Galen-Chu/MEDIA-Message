name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # FB 瀏覽器 OAuth(D7):app id/組態 id 非機密,統一走 secret 選用注入;
      # 缺 secret = 降級建置(示範模式),不得失敗——CI 與本地無 env 路徑同規
      - name: Write optional FB env
        if: ${{ secrets.FB_APP_ID != '' && secrets.FB_CONFIG_ID != '' }}
        run: |
          printf 'VITE_FB_APP_ID=%s\nVITE_FB_CONFIG_ID=%s\n' "${{ secrets.FB_APP_ID }}" "${{ secrets.FB_CONFIG_ID }}" > .env.production
      - run: npm test
      # build 內含 tsc -b 型別檢查,等同基本 CI 關卡
      - run: npm run build
      # E2E smoke 跑在 preview server;通過才部署(驗收站品質閘門)
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

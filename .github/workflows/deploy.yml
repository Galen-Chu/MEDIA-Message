name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # action runtime 對齊文管庫 2026-10-14 升級組合(ubuntu-latest 已於 2026-10-19 遷 Ubuntu 26;
      # playwright 1.62.1 的 nativeDeps 已涵蓋 ubuntu26.04,升級行為不變)
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # FB 瀏覽器 OAuth(D7):app id/組態 id 非機密,統一走 secret 選用注入;
      # 缺 secret = 降級建置(示範模式),不得失敗——CI 與本地無 env 路徑同規
      # secrets context 不可用於 step if(文件 context availability 表),
      # 條件判斷移入 shell:缺任一 secret = 不寫檔 = 降級建置(示範模式),不得失敗
      - name: Write optional FB env
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_CONFIG_ID: ${{ secrets.FB_CONFIG_ID }}
        run: |
          if [ -n "$FB_APP_ID" ] && [ -n "$FB_CONFIG_ID" ]; then
            printf 'VITE_FB_APP_ID=%s\nVITE_FB_CONFIG_ID=%s\n' "$FB_APP_ID" "$FB_CONFIG_ID" > .env.production
          fi
      - run: npm test
      # 對比度稽核(回歸閘門;2026-10-23 品牌重上色時自假閘門升級為解析 index.css 的版本)
      - run: npm run test:contrast
      # build 內含 tsc -b 型別檢查,等同基本 CI 關卡
      - run: npm run build
      # E2E smoke 跑在 preview server;通過才部署(驗收站品質閘門)
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
